name: ZP AIO Build

# ⚠️ IMPORTANT: This workflow is currently DISABLED (no active triggers)
# 
# KNOWN ISSUE - Image Naming Mismatch:
# The k8s/build.sh script builds images as:
#   - zoomphant/pack:vX.Y.Z
#   - zoomphant/aio:vX.Y.Z
#
# But our public documentation (README.md, docs/start/index.md) tells users to run:
#   - docker run zoomphant/zoomphant-pack:latest
#   - docker run zoomphant/zoomphant-aio:latest
#
# BEFORE RE-ENABLING THIS WORKFLOW:
# 1. Decide on image naming convention:
#    Option A: Update build.sh to use "zoomphant-pack" and "zoomphant-aio" (recommended)
#    Option B: Update all documentation to use "pack" and "aio" without prefix
# 2. Update IMAGES file in sync-images.yml to match chosen names
# 3. Ensure k8s/build.sh Dockerfiles match (may need to rename Dockerfile.pack → Dockerfile.zoomphant-pack)
#
# See IMAGE_NAMING_ISSUE.md for full details.

on:
  # DISABLED: Uncomment to re-enable automatic builds
  # push:
  #   paths:
  #     - 'releases/**'
      
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Use building cache'
        required: false
        default: 'false'
        type: boolean
      tag_as_latest:
        description: 'Tag images as latest'
        required: false
        default: 'true'
        type: boolean
      skip_push:
        description: 'Skip pushing images to registry'
        required: false
        default: 'false'
        type: boolean
    
#  schedule:
#    - cron: "0 0 * * *"

env:
  REPO_BASE: ${{ vars.REPO_BASE }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Build

    steps:
    - uses: actions/checkout@v4

    - name: Show base
      run: echo "$GITHUB_CONTEXT"

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Login ZP Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.ZPDOCKER_REGISTRY }}
        username: ${{ vars.ZPDOCKER_USERNAME }}
        password: ${{ secrets.ZPDOCKER_PASSWORD }}
          
    - name: Build the Docker image
      run: |
        build_cmd="./k8s/build.sh"
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          if [[ "${{ inputs.tag_as_latest }}" == "true" ]]; then
            build_cmd="$build_cmd -l"
          fi
          if [[ "${{ inputs.use_cache }}" == "true" ]]; then
            build_cmd="$build_cmd -c"
          fi
          if [[ "${{ inputs.skip_push }}" == "true" ]]; then
            build_cmd="$build_cmd -n"
          fi
        else
          # For push triggers, use default behavior (tag as latest)
          build_cmd="$build_cmd -l"
        fi
        echo "Running: $build_cmd"
        $build_cmd
