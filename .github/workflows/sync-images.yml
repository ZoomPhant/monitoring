name: Sync Docker Images

on:
  workflow_dispatch:
    # This workflow is MANUAL only — it will not run on push or schedule.
    inputs:
      image:
        description: 'Specific image:tag to sync (e.g., collector:v2.5.5). Leave empty to auto-sync all from IMAGES file with versions from RELEASE.'
        required: false
        type: string
      source_registry:
        description: 'Source registry (default: SOURCE_DOCKER_REGISTRY var)'
        required: false
        type: string
      source_org:
        description: 'Source organization (default: SOURCE_DOCKER_ORG var, then REPO_BASE var)'
        required: false
        type: string
      target_registry:
        description: 'Target registry (default: ZPDOCKER_REGISTRY var)'
        required: false
        type: string
      target_org:
        description: 'Target organization (default: TARGET_DOCKER_ORG var, then source_org)'
        required: false
        type: string
      dry_run:
        description: 'Dry run - show what would be synced without actually syncing'
        required: false
        default: false
        type: boolean

env:
  SOURCE_DOCKER_REGISTRY: ${{ vars.SOURCE_DOCKER_REGISTRY || 'docker.io' }}
  SOURCE_DOCKER_ORG: ${{ vars.SOURCE_DOCKER_ORG }}
  SOURCE_DOCKER_USERNAME: ${{ vars.SOURCE_DOCKER_USERNAME }}
  SOURCE_DOCKER_PASSWORD: ${{ secrets.SOURCE_DOCKER_PASSWORD }}
  TARGET_DOCKER_REGISTRY: ${{ vars.ZPDOCKER_REGISTRY }}
  TARGET_DOCKER_ORG: ${{ vars.TARGET_DOCKER_ORG }}
  TARGET_DOCKER_USERNAME: ${{ vars.ZPDOCKER_USERNAME }}
  TARGET_DOCKER_PASSWORD: ${{ secrets.ZPDOCKER_PASSWORD }}

jobs:
  sync-images:
    runs-on: ubuntu-latest
    environment: Build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Log in to Source Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.SOURCE_DOCKER_REGISTRY }}
        username: ${{ env.SOURCE_DOCKER_USERNAME || vars.DOCKER_USERNAME }}
        password: ${{ env.SOURCE_DOCKER_PASSWORD || secrets.DOCKER_PASSWORD }}

    - name: Log in to Target Registry
      if: vars.ZPDOCKER_REGISTRY != ''
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.ZPDOCKER_REGISTRY }}
        username: ${{ vars.ZPDOCKER_USERNAME }}
        password: ${{ secrets.ZPDOCKER_PASSWORD }}

    - name: Determine images to sync
      id: images
      run: |
        SOURCE_REG="${{ inputs.source_registry || env.SOURCE_DOCKER_REGISTRY }}"
        SOURCE_ORG="${{ inputs.source_org || env.SOURCE_DOCKER_ORG || vars.REPO_BASE || 'zpdemo' }}"
        TARGET_REG="${{ inputs.target_registry || env.TARGET_DOCKER_REGISTRY }}"
        TARGET_ORG="${{ inputs.target_org || env.TARGET_DOCKER_ORG }}"
        # Fall back to SOURCE_ORG if TARGET_ORG is empty
        if [ -z "$TARGET_ORG" ]; then
          TARGET_ORG="$SOURCE_ORG"
        fi

        # If SOURCE_ORG already contains the registry hostname (e.g. REPO_BASE = registry.host/org),
        # use it as-is; otherwise prepend SOURCE_REG.
        if [[ "$SOURCE_ORG" == *"/"* && "$SOURCE_ORG" == *"."* ]]; then
          SOURCE_PREFIX="$SOURCE_ORG"
        else
          SOURCE_PREFIX="$SOURCE_REG/$SOURCE_ORG"
        fi

        # Same for target
        if [[ "$TARGET_ORG" == *"/"* && "$TARGET_ORG" == *"."* ]]; then
          TARGET_PREFIX="$TARGET_ORG"
        else
          TARGET_PREFIX="$TARGET_REG/$TARGET_ORG"
        fi
        
        if [ -z "$TARGET_REG" ]; then
          echo "❌ ERROR: Target registry not configured. Set ZPDOCKER_REGISTRY variable or provide target_registry input."
          exit 1
        fi
        
        echo "source_registry=$SOURCE_REG" >> $GITHUB_OUTPUT
        echo "source_org=$SOURCE_ORG" >> $GITHUB_OUTPUT
        echo "target_registry=$TARGET_REG" >> $GITHUB_OUTPUT
        echo "target_org=$TARGET_ORG" >> $GITHUB_OUTPUT
        echo "source_prefix=$SOURCE_PREFIX" >> $GITHUB_OUTPUT
        echo "target_prefix=$TARGET_PREFIX" >> $GITHUB_OUTPUT
        
        if [ -n "${{ inputs.image }}" ]; then
          # Single image from manual input (format: image:tag)
          IMAGE_TAG="${{ inputs.image }}"
          echo "images=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "mode=single" >> $GITHUB_OUTPUT
          echo "Syncing single image: $IMAGE_TAG"
        else
          # Read RELEASE file to get component versions
          if [ ! -f RELEASE ]; then
            echo "❌ ERROR: RELEASE file not found in repository root"
            exit 1
          fi
          
          declare -A VERSIONS
          while IFS='#' read -r key value; do
            # Skip empty lines and comments
            [[ -z "$key" || "$key" =~ ^[[:space:]]*$ || "$key" =~ ^[[:space:]]*# ]] && continue
            VERSIONS[$key]="v$value"
          done < RELEASE
          
          echo "📦 Versions from RELEASE file:"
          for key in "${!VERSIONS[@]}"; do
            echo "  $key = ${VERSIONS[$key]}"
          done
          
          # Read from IMAGES file (format: image_name:release_key per line)
          if [ ! -f IMAGES ]; then
            echo "❌ ERROR: IMAGES file not found in repository root"
            exit 1
          fi
          
          IMAGES_LIST=""
          echo ""
          echo "🐳 Expanding images from IMAGES file:"
          while IFS=':' read -r image_name release_key; do
            # Skip empty lines and comments
            [[ -z "$image_name" || "$image_name" =~ ^[[:space:]]*$ || "$image_name" =~ ^[[:space:]]*# ]] && continue
            
            # Trim whitespace
            image_name=$(echo "$image_name" | xargs)
            release_key=$(echo "$release_key" | xargs)
            
            # Look up version from RELEASE
            version="${VERSIONS[$release_key]}"
            if [ -z "$version" ]; then
              echo "  ⚠️  WARNING: No version found for release_key='$release_key' (image: $image_name)"
              continue
            fi
            
            echo "  $image_name:$version ($release_key)"
            echo "  $image_name:latest"
            
            # Add both versioned and latest tags
            IMAGES_LIST="$IMAGES_LIST ${image_name}:${version} ${image_name}:latest"
          done < <(grep -v '^#' IMAGES | grep -v '^[[:space:]]*$')
          
          if [ -z "$IMAGES_LIST" ]; then
            echo "❌ ERROR: No valid images found in IMAGES file"
            exit 1
          fi
          
          echo "images=$IMAGES_LIST" >> $GITHUB_OUTPUT
          echo "mode=file" >> $GITHUB_OUTPUT
        fi

    - name: Sync images
      id: sync
      if: steps.images.outputs.mode != ''
      env:
        SOURCE_REG: ${{ steps.images.outputs.source_registry }}
        SOURCE_ORG: ${{ steps.images.outputs.source_org }}
        TARGET_REG: ${{ steps.images.outputs.target_registry }}
        TARGET_ORG: ${{ steps.images.outputs.target_org }}
        SOURCE_PREFIX: ${{ steps.images.outputs.source_prefix }}
        TARGET_PREFIX: ${{ steps.images.outputs.target_prefix }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        IMAGES="${{ steps.images.outputs.images }}"
        MODE="${{ steps.images.outputs.mode }}"
        
        echo "### 🐳 Sync Configuration" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Mode:** $MODE" >> $GITHUB_STEP_SUMMARY
        echo "**Source:** $SOURCE_PREFIX" >> $GITHUB_STEP_SUMMARY
        echo "**Target:** $TARGET_PREFIX" >> $GITHUB_STEP_SUMMARY
        echo "**Dry Run:** $DRY_RUN" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "$DRY_RUN" == "true" ]; then
          echo "⚠️ **DRY RUN MODE** - No images will be pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "### 📋 Images to Sync" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Source | Target |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
        
        SUCCESS_COUNT=0
        FAILED_IMAGES=""
        
        for IMAGE_TAG in $IMAGES; do
          # Construct full source and target image names
          SOURCE_IMAGE="$SOURCE_PREFIX/$IMAGE_TAG"
          TARGET_IMAGE="$TARGET_PREFIX/$IMAGE_TAG"
          
          echo "| $SOURCE_IMAGE | $TARGET_IMAGE |" >> $GITHUB_STEP_SUMMARY
          
          if [ "$DRY_RUN" == "true" ]; then
            echo "✅ Would sync: $SOURCE_IMAGE → $TARGET_IMAGE"
            SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            continue
          fi
          
          echo "Syncing: $SOURCE_IMAGE → $TARGET_IMAGE"
          
          # Pull from source
          if docker pull "$SOURCE_IMAGE"; then
            echo "  ✓ Pulled $SOURCE_IMAGE"
          else
            echo "  ❌ Failed to pull $SOURCE_IMAGE"
            FAILED_IMAGES="$FAILED_IMAGES $SOURCE_IMAGE"
            continue
          fi
          
          # Tag for target
          if docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"; then
            echo "  ✓ Tagged as $TARGET_IMAGE"
          else
            echo "  ❌ Failed to tag $SOURCE_IMAGE"
            FAILED_IMAGES="$FAILED_IMAGES $SOURCE_IMAGE"
            continue
          fi
          
          # Push to target
          if docker push "$TARGET_IMAGE"; then
            echo "  ✓ Pushed $TARGET_IMAGE"
            SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
          else
            echo "  ❌ Failed to push $TARGET_IMAGE"
            FAILED_IMAGES="$FAILED_IMAGES $SOURCE_IMAGE"
          fi
        done
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Successfully synced:** $SUCCESS_COUNT" >> $GITHUB_STEP_SUMMARY
        
        if [ -n "$FAILED_IMAGES" ]; then
          echo "**Failed:** $(echo $FAILED_IMAGES | wc -w)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Failed images:" >> $GITHUB_STEP_SUMMARY
          for fail in $FAILED_IMAGES; do
            echo "- $fail" >> $GITHUB_STEP_SUMMARY
          done
          echo "sync_failed=true" >> $GITHUB_OUTPUT
          exit 1
        else
          echo "**Failed:** 0" >> $GITHUB_STEP_SUMMARY
          echo "sync_failed=false" >> $GITHUB_OUTPUT
        fi

    - name: Sync Summary
      if: always()
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.sync.outputs.sync_failed }}" == "true" ]; then
          echo "### ❌ Sync Completed with Errors" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ✅ Sync Completed Successfully" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Source:** ${{ steps.images.outputs.source_registry }}/${{ steps.images.outputs.source_org }}" >> $GITHUB_STEP_SUMMARY
        echo "**Target:** ${{ steps.images.outputs.target_registry }}/${{ steps.images.outputs.target_org }}" >> $GITHUB_STEP_SUMMARY
        echo "**Mode:** ${{ steps.images.outputs.mode }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 💡 Usage" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Sync all images from IMAGES file:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "gh workflow run sync-images.yml" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Sync a specific image:tag:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "gh workflow run sync-images.yml -f image=collector:v2.5.5" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Override source/target org:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "gh workflow run sync-images.yml -f source_org=zpdemo -f target_org=zpdemo" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Dry run:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "gh workflow run sync-images.yml -f dry_run=true" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY